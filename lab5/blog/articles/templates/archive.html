<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="stylesheet" href="{{ STATIC_URL }}/static/css/expense.css">
    <meta charset="UTF-8">
    <title>Архив статей</title>
</head>

<body class="archive-page">

<div class="header">
    <img src="{{ STATIC_URL }}/static/logo.svg" class="logo">
</div>

<div class="archive">

    {% for post in posts %}

    <div class="one-post">

        <h2 class="post-title">
            <a href="{% url 'get_expense' post.id %}">
                Тип расхода: {{ post.expense_type }}
            </a>
        </h2>

        <div class="article-info">

            <div class="article-author">
                Сотрудник: {{ post.employee.username }}
            </div>

            <div class="article-created-date">
                Дата: {{ post.purchase_date }}
            </div>

        </div>

        <p class="article-text">
            Отдел: {{ post.department }}
        </p>

        <p>
            Сумма: {{ post.amount }}
        </p>

        <p>
            Номер телефона: {{ post.receipt_number }}
        </p>

    </div>

    {% endfor %}

</div>

</body>
</html>
